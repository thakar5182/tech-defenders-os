<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tech Defenders Secure Portal</title>
  <link rel="icon" type="image/webp" href="/assets/tech-defenders-logo.webp">
  <style>
    :root{--gold:#e6b91e;--ink:#090909;--panel:#171610;--line:#393522;--muted:#aaa58f;--ok:#62d394;--bad:#ff7a7a}
    *{box-sizing:border-box}body{margin:0;background:#0b0b09;color:#f8f5e8;font:15px/1.5 Inter,Segoe UI,sans-serif}
    button,input,textarea,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;gap:14px;padding:12px 0 28px}
    .top img{width:48px;height:48px;border-radius:12px}.top b{font-size:18px;letter-spacing:.05em}.top small{display:block;color:var(--gold)}
    .hero,.card{border:1px solid var(--line);background:linear-gradient(145deg,#1b1a13,#11110d);border-radius:20px}.hero{padding:28px;margin-bottom:18px}
    .hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,44px)}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr);margin:18px 0}
    .kpi,.card{padding:18px}.kpi{border:1px solid var(--line);border-radius:16px;background:#15140f}.kpi b{display:block;font-size:23px;color:var(--gold)}.cols{grid-template-columns:repeat(2,1fr)}
    h2{font-size:18px;margin:0 0 14px}.item{padding:13px 0;border-top:1px solid #2e2b1d;display:flex;gap:12px;justify-content:space-between;align-items:center}.item:first-of-type{border-top:0}
    .badge{padding:3px 9px;border-radius:20px;border:1px solid #554b20;color:#f4cd40;font-size:12px;text-transform:capitalize}.btn{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:700}.btn:disabled{opacity:.55;cursor:wait}.gold{background:var(--gold);color:#151100}.outline{background:transparent;color:#fff;border:1px solid #4d4938}
    form{display:grid;gap:10px}input,textarea,select{width:100%;background:#0d0d0b;color:#fff;border:1px solid #494532;border-radius:10px;padding:11px}input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}textarea{min-height:90px}.error{color:var(--bad);padding:12px;border:1px solid #6d3030;border-radius:12px}.hidden{display:none!important}
    .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.wide{grid-column:1/-1}.stack{display:block}.item-head,.action-row,.form-row{display:flex;gap:10px;align-items:center;justify-content:space-between}.item small,.item-head small{display:block;color:var(--muted)}.action-row{justify-content:flex-end;flex-wrap:wrap}.panel-form,.rfq-form,.reply-form{margin-top:14px;padding:14px;border:1px solid #302d20;border-radius:14px;background:#0e0e0b}.panel-form h3{margin:0 0 4px}.subgrid,.line-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.subgrid>div,.line-grid label{padding:12px;border-radius:12px;background:#0d0d0a}.subgrid p{margin:9px 0}.line-grid label span{display:block;margin-bottom:8px}.line-grid input+input{margin-top:7px}.conversation{display:grid;gap:8px;margin:12px 0}.message{max-width:85%;padding:10px 12px;border-radius:12px;background:#242218}.message.mine{margin-left:auto;background:#342d0c;border:1px solid #655515}.message p{margin:4px 0;white-space:pre-wrap}.timeline{display:grid;gap:0}.timeline>div{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid #2e2b1d}.timeline>div:first-child{border-top:0}.timeline span,.timeline small{color:var(--muted)}.empty{padding:8px 0}
    @media(max-width:760px){.kpis,.cols{grid-template-columns:1fr 1fr}.shell{padding:14px}.subgrid,.line-grid{grid-template-columns:1fr}.timeline>div{grid-template-columns:1fr}.timeline small{margin-top:-7px}}@media(max-width:560px){.kpis,.cols{grid-template-columns:1fr}.hero{padding:20px}.item-head,.form-row{align-items:flex-start;flex-direction:column}.form-row>*{width:100%}.action-row{justify-content:flex-start}.btn{min-height:42px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><img src="/assets/tech-defenders-logo.webp" alt=""><div><b>TECH DEFENDERS</b><small>SECURE BUSINESS PORTAL</small></div></header>
    <section id="loading" class="hero"><h1>Opening your secure workspace…</h1><p class="muted">Verifying the private access link.</p></section>
    <section id="error" class="hero hidden"><h1>Link unavailable</h1><p class="error" id="error-text"></p><p class="muted">Ask Tech Defenders for a new portal invitation.</p></section>
    <div id="portal" class="hidden"></div>
  </main>
  <script src="/js/portal.js"></script>
</body>
</html>
