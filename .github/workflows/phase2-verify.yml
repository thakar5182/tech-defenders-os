name: Phase 2 verification
on:
  push:
    branches: [phase-2-finance-compliance]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  complete-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
