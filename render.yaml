## FREE web service + external PostgreSQL. DATABASE_URL must point to a
## durable database (for example Neon Free); local Render files are ephemeral.
services:
  - type: web
    name: tech-defenders-os
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: AUTO_BACKUP
        value: "false"
      - key: AUTO_AUTOMATION
        value: "true"
      - key: PROVIDER_TIMEOUT_MS
        value: "15000"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "true"
      - key: INITIAL_SUPERADMIN_PASSWORD
        sync: false
      - key: SYNC_SUPERADMIN_PASSWORD
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTO_SIGNUP
        value: "true"
      - key: PUBLIC_APP_URL
        sync: false
      - key: INVOICE_LINK_SECRET
        generateValue: true
      - key: IMPORT_MAX_UPLOAD_MB
        value: "25"
      - key: IMPORT_MAX_ARCHIVE_FILES
        value: "250"
      - key: IMPORT_MAX_EXTRACTED_MB
        value: "100"
      - key: IMPORT_MAX_FILE_MB
        value: "25"
      - key: PACKAGE_MAX_FILES
        value: "250"
      - key: PACKAGE_MAX_FILE_MB
        value: "25"
      - key: PACKAGE_MAX_TOTAL_MB
        value: "100"
      - key: EMAIL_WORKER_BATCH
        value: "10"
      - key: EMAIL_OTP_TTL_MINUTES
        value: "10"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: techdefenderss@gmail.com
      - key: BREVO_SENDER_NAME
        value: Tech Defenders
